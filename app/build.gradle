plugins {
    id 'com.android.application'
}

android {
    namespace 'com.geminiwrapper.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.geminiwrapper.app"
        minSdk 29          // Android 10
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies: the app only uses the Android framework WebView.
